# CI (Session 23): on every push, GitHub runs our unit and integration tests on a clean machine
# the end-to-end tests (e2e/) run on my computer: they download MongoDB and a browser, too heavy for this
name: CI
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    env:
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  # the same job copied for client/, plus the build (a build that breaks fails CI too)
  client:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: client }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
